trigger:
  batch: true
  branches:
    include:
    - dotnet/main
    - dotnet/release/*

pr: none

variables:
- template: /eng/common-variables.yml@self
- template: /eng/common/templates-official/variables/pool-providers.yml@self
- name: CheckNuGetSizesScript
  value: >-
    $nupkgs_large=(Get-ChildItem artifacts/packages/$(_BuildConfig)/Shipping -recurse -include "*.nupkg" | Select-Object Name,Length | Where-Object { $_.Length -gt 250*1MB });
    if ($nupkgs_large.Length -gt 0) { Write-Error "NuGet size exceeds 250MiB: $($nupkgs_large | Format-Table | Out-String)"; exit 1 }

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    sdl:
      git:
        submodules: false # TODO: we should reenable this
      tsa:
        enabled: true
      policheck:
        enabled: true
      sourceAnalysisPool:
        name: $(DncEngInternalBuildPool)
        image: 1es-windows-2022
        os: windows
    containers:
      mariner20crossamd64:
        image: mcr.microsoft.com/dotnet-buildtools/prereqs:cbl-mariner-2.0-cross-amd64
    stages:
    - stage: build
      displayName: Build
      jobs:
      - template: /eng/common/templates-official/jobs/jobs.yml@self
        parameters:
          enablePublishBuildArtifacts: true
          enablePublishBuildAssets: true
          publishingVersion: 4
          enableMicrobuild: true
          jobs:

          ############ LINUX x64 BUILD ############
          - job: Build_Linux_x64
            enablePublishing: true
            displayName: Linux_x64
            timeoutInMinutes: 480
            pool:
              name: $(DncEngInternalBuildPool)
              image: build.azurelinux.3.amd64
              os: linux
            container: mariner20crossamd64
            preSteps:
            - checkout: self
              submodules: recursive

            steps:
            - bash: |
                ./build.sh --ci --pack --publish --configuration $(_BuildConfig) $(_InternalBuildArgs) /p:AssetManifestOS=linux /p:ArchGroup=x64 /p:TargetArchitecture=x64 /p:PlatformName=x64 /p:PackageRID=linux-x64 /p:RestoreUsingNuGetTargets=false
              displayName: 'Build and Publish'

            - powershell: $(CheckNuGetSizesScript)
              displayName: Check NuGet sizes
              continueOnError: true # TODO: our packages exceed the size limits, but we don't want to fail the build for now

          ############ LINUX arm64 BUILD ############
          - job: Build_Linux_arm64
            enablePublishing: true
            displayName: Linux_arm64
            timeoutInMinutes: 480
            pool:
              name: $(DncEngInternalBuildPool)
              image: build.azurelinux.3.amd64
              os: linux
            container: mariner20crossamd64
            preSteps:
            - checkout: self
              submodules: recursive

            steps:
            - bash: |
                ./build.sh --ci --pack --publish --configuration $(_BuildConfig) $(_InternalBuildArgs) /p:AssetManifestOS=linux /p:ArchGroup=arm64 /p:TargetArchitecture=arm64 /p:PlatformName=arm64 /p:PackageRID=linux-arm64 /p:RestoreUsingNuGetTargets=false
              displayName: 'Build and Publish'

            - powershell: $(CheckNuGetSizesScript)
              displayName: Check NuGet sizes
              continueOnError: true # TODO: our packages exceed the size limits, but we don't want to fail the build for now

          ############ LINUX MUSL x64 BUILD ############
          - job: Build_Linux_musl_x64
            enablePublishing: true
            displayName: Linux_musl_x64
            timeoutInMinutes: 480
            pool:
              name: $(DncEngInternalBuildPool)
              image: build.azurelinux.3.amd64
              os: linux
            container: mariner20crossamd64
            preSteps:
            - checkout: self
              submodules: recursive

            steps:
            - bash: |
                ./build.sh --ci --pack --publish --configuration $(_BuildConfig) $(_InternalBuildArgs) /p:AssetManifestOS=linux-musl /p:ArchGroup=x64 /p:TargetArchitecture=x64 /p:PlatformName=x64 /p:PackageRID=linux-musl-x64 /p:RestoreUsingNuGetTargets=false
              displayName: 'Build and Publish'

            - powershell: $(CheckNuGetSizesScript)
              displayName: Check NuGet sizes
              continueOnError: true # TODO: our packages exceed the size limits, but we don't want to fail the build for now

          ############ LINUX MUSL arm64 BUILD ############
          - job: Build_Linux_musl_arm64
            enablePublishing: true
            displayName: Linux_musl_arm64
            timeoutInMinutes: 480
            pool:
              name: $(DncEngInternalBuildPool)
              image: build.azurelinux.3.amd64
              os: linux
            container: mariner20crossamd64
            preSteps:
            - checkout: self
              submodules: recursive

            steps:
            - bash: |
                ./build.sh --ci --pack --publish --configuration $(_BuildConfig) $(_InternalBuildArgs) /p:AssetManifestOS=linux-musl /p:ArchGroup=arm64 /p:TargetArchitecture=arm64 /p:PlatformName=arm64 /p:PackageRID=linux-musl-arm64 /p:RestoreUsingNuGetTargets=false
              displayName: 'Build and Publish'

            - powershell: $(CheckNuGetSizesScript)
              displayName: Check NuGet sizes
              continueOnError: true # TODO: our packages exceed the size limits, but we don't want to fail the build for now

          ############ MACOS x64 BUILD ############
          - job: Build_macOS_x64
            enablePublishing: true
            displayName: macOS_x64
            timeoutInMinutes: 480
            pool:
              name: Azure Pipelines
              image: macos-14
              os: macOS
            preSteps:
            - checkout: self
              submodules: recursive

            steps:
            - bash: |
                ./build.sh --ci --pack --publish --configuration $(_BuildConfig) $(_InternalBuildArgs) /p:ArchGroup=x64 /p:TargetArchitecture=x64 /p:RestoreUsingNuGetTargets=false
              displayName: 'Build and Publish'

            - powershell: $(CheckNuGetSizesScript)
              displayName: Check NuGet sizes
              continueOnError: true # TODO: our packages exceed the size limits, but we don't want to fail the build for now

          ############ MACOS arm64 BUILD ############
          - job: Build_macOS_arm64
            enablePublishing: true
            displayName: macOS_arm64
            timeoutInMinutes: 480
            pool:
              name: Azure Pipelines
              image: macos-14
              os: macOS
            preSteps:
            - checkout: self
              submodules: recursive

            steps:
            - bash: |
                ./build.sh --ci --pack --publish --configuration $(_BuildConfig) $(_InternalBuildArgs) /p:ArchGroup=arm64 /p:TargetArchitecture=arm64 /p:RestoreUsingNuGetTargets=false
              displayName: 'Build and Publish'

            - powershell: $(CheckNuGetSizesScript)
              displayName: Check NuGet sizes
              continueOnError: true # TODO: our packages exceed the size limits, but we don't want to fail the build for now

          ############ WINDOWS x64 BUILD ############
          - job: Build_Windows_x64
            enablePublishing: true
            displayName: Windows_x64
            timeoutInMinutes: 480
            pool:
              name: $(DncEngInternalBuildPool)
              image: 1es-windows-2022
              os: windows
            preSteps:
            - checkout: self
              submodules: recursive

            steps:

            - powershell: |
                Invoke-WebRequest "https://netcorenativeassets.blob.core.windows.net/resource-packages/external/windows/make/make-4.4.1-2-x86_64.zip" -OutFile C:\make.zip
                Invoke-WebRequest "https://netcorenativeassets.blob.core.windows.net/resource-packages/external/windows/diffutils/diffutils-3.12-1-x86_64.zip" -OutFile C:\diffutils.zip
                Expand-Archive -LiteralPath C:\make.zip -DestinationPath C:\
                Expand-Archive -LiteralPath C:\diffutils.zip -DestinationPath C:\
                cp C:\make-4.4.1-2-x86_64\usr\bin\make.exe C:\msys64\usr\bin\
                cp C:\diffutils-3.12-1-x86_64\usr\bin\diff.exe C:\msys64\usr\bin\
              displayName: Install make and diff

            - script: |
                .\build.cmd -ci -pack -publish -sign -configuration $(_BuildConfig) /p:ArchGroup=x64 /p:TargetArchitecture=x64 /p:PackageRID=win-x64 /p:AssetManifestOS=win /p:PlatformName=x64 /p:MsysDir=c:\msys64 /p:SignCheckExclusionsFile='$(Build.SourcesDirectory)/eng/SignCheckExclusionsFile.txt' $(_InternalBuildArgs)
              displayName: Build and Publish

            - powershell: $(CheckNuGetSizesScript)
              displayName: Check NuGet sizes
              continueOnError: true # TODO: our packages exceed the size limits, but we don't want to fail the build for now

          ############ WINDOWS arm64 BUILD ############
          - job: Build_Windows_arm64
            enablePublishing: true
            displayName: Windows_arm64
            timeoutInMinutes: 480
            pool:
              name: $(DncEngInternalBuildPool)
              image: 1es-windows-2022
              os: windows
            preSteps:
            - checkout: self
              submodules: recursive

            steps:

            - powershell: |
                Invoke-WebRequest "https://netcorenativeassets.blob.core.windows.net/resource-packages/external/windows/make/make-4.4.1-2-x86_64.zip" -OutFile C:\make.zip
                Invoke-WebRequest "https://netcorenativeassets.blob.core.windows.net/resource-packages/external/windows/diffutils/diffutils-3.12-1-x86_64.zip" -OutFile C:\diffutils.zip
                Expand-Archive -LiteralPath C:\make.zip -DestinationPath C:\
                Expand-Archive -LiteralPath C:\diffutils.zip -DestinationPath C:\
                cp C:\make-4.4.1-2-x86_64\usr\bin\make.exe C:\msys64\usr\bin\
                cp C:\diffutils-3.12-1-x86_64\usr\bin\diff.exe C:\msys64\usr\bin\
              displayName: Install make and diff

            - script: |
                .\build.cmd -ci -pack -publish -sign -configuration $(_BuildConfig) /p:ArchGroup=arm64 /p:TargetArchitecture=arm64 /p:PackageRID=win-arm64 /p:AssetManifestOS=win /p:PlatformName=arm64 /p:MsysDir=c:\msys64 /p:SignCheckExclusionsFile='$(Build.SourcesDirectory)/eng/SignCheckExclusionsFile.txt' $(_InternalBuildArgs)
              displayName: Build and Publish

            - powershell: $(CheckNuGetSizesScript)
              displayName: Check NuGet sizes
              continueOnError: true # TODO: our packages exceed the size limits, but we don't want to fail the build for now

    ############ POST BUILD ARCADE LOGIC ############
    - template: /eng/common/templates-official/post-build/post-build.yml@self
      parameters:
        publishingInfraVersion: 4
        enableSourceLinkValidation: false
        enableSigningValidation: false
        enableSymbolValidation: false
        enableNugetValidation: true
