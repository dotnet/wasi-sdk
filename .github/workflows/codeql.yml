name: CodeQL

on:
  push:
    branches:
      - dotnet/main
  pull_request:
    branches:
      - dotnet/main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: python
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - if: matrix.language == 'c-cpp'
        name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - if: matrix.language == 'c-cpp'
        name: Build wasi-sdk
        env:
          CCACHE_DISABLE: 1
        run: |
          # We cannot use `--depth 1` here because the GNU config submodule is not pinned
          # to a particular tag or branch.
          git submodule update --init --depth 16 --jobs 3
          NINJA_FLAGS=-v make package LLVM_CMAKE_FLAGS=-DLLVM_CCACHE_BUILD=OFF

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
